<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Event in javaScript</h1>
    <ul>
        <li id="list1">X:</li>
        <li id="list2">Y:</li>
    </ul>
    <script>
        window.addEventListener('mousemove',(e)=>{
            document.getElementById('list1').innerText ='X:' + e.clientX;
            document.getElementById('list2').innerHTML ='Y:' + e.clientY;
        })

    </script>
</body>
</html>
